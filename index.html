<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>黄岛房源记忆助手</title>
<style>
:root{
  --bg:#F5F4F0; --card:#FFFFFF; --ink:#161A18; --mid:#575E59; --mute:#8B928C;
  --line:#E6E4DE; --acc:#17594C; --acc-soft:#E4EFEA; --warm:#B14B3C; --down:#2C7A66;
  --r:14px; --tab-h:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.num{font-variant-numeric:tabular-nums}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,244,240,.93);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:12px 16px 10px;display:flex;align-items:flex-end;justify-content:space-between}
.tb-title{font-size:19px;font-weight:750;letter-spacing:-.02em}
.tb-sub{font-size:11px;color:var(--mute);margin-top:3px}
.tb-tag{font-size:10.5px;color:var(--acc);background:var(--acc-soft);border:1px solid #D3E6DF;
  padding:4px 8px;border-radius:20px;white-space:nowrap}

main{padding:14px 14px calc(var(--tab-h) + 34px)}
.view{display:none}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* 概览条 */
.sum{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 2px;margin-bottom:6px}
.sum>div{text-align:center;border-right:1px solid var(--line)}
.sum>div:last-child{border-right:0}
.sum b{display:block;font-size:18px;font-weight:750;letter-spacing:-.02em}
.sum span{font-size:10.5px;color:var(--mute)}

.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 9px}
.sec h2{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.08em;margin:0}
.sec .sorts{display:flex;gap:6px}
.sec .sorts button{background:none;border:0;padding:2px 0;font-size:12px;color:var(--mute)}
.sec .sorts button.on{color:var(--acc);font-weight:650}

/* 商圈卡 */
.bcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:9px;cursor:pointer}
.bcard:active{background:#FCFCFA}
.bt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bname{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.bcnt{font-size:11px;color:var(--mid);background:#F2F0EA;padding:3px 8px;border-radius:20px;white-space:nowrap}
.bvol{font-size:12.5px;color:var(--mid);margin-top:4px}
.bvol b{color:var(--ink);font-weight:650}
.tracks{margin:11px 0 6px}
.track{display:flex;align-items:center;height:7px;margin-top:5px}
.track em{font-size:10.5px;color:var(--mute);font-style:normal;width:26px;flex:0 0 26px}
.track .rail{position:relative;flex:1;height:7px;background:#EFEDE7;border-radius:4px}
.track .rail i{position:absolute;top:0;height:7px;border-radius:4px}
.track.on .rail i{background:#CBE0D8}
.track.dl .rail i{background:var(--acc);opacity:.62}
.brange{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mid);margin-top:6px}

/* 小区列表 */
.searchrow{display:flex;gap:8px;margin-bottom:10px}
.searchrow input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);outline:none}
.searchrow input::placeholder{color:#A9AFA9}
.chips{display:flex;gap:6px;overflow-x:auto;padding:1px 0 9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mid);
  border-radius:20px;padding:6px 12px;font-size:12.5px}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}

.crow{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px;cursor:pointer}
.crow:active{background:#FCFCFA}
.crow .l{min-width:0}
.crow .cn{font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .csub{font-size:11.5px;color:var(--mute);margin-top:3px;display:flex;gap:7px;align-items:center}
.crow .csub em{font-style:normal;background:#F2F0EA;color:var(--mid);padding:1px 6px;border-radius:9px;font-size:10.5px}
.crow .r{text-align:right;flex:0 0 auto;margin-left:10px}
.crow .op{font-size:15px;font-weight:750;letter-spacing:-.02em}
.crow .dp{font-size:11px;color:var(--mute);margin-top:3px}

/* 详情页 */
.detail{position:fixed;inset:0;max-width:560px;margin:0 auto;background:var(--bg);z-index:40;
  display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.detail.on{display:block;animation:slide .22s cubic-bezier(.2,.8,.3,1)}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.dhead{position:sticky;top:0;z-index:3;background:rgba(245,244,240,.95);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:9px}
.dhead .dt{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.act{color:#C08A2E;border-color:#EBD9B6;background:#FBF5E8}
.dbody{padding:14px 14px 42px}

.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hname{font-size:21px;font-weight:750;letter-spacing:-.02em}
.hmeta{display:flex;gap:7px;align-items:center;margin-top:7px;flex-wrap:wrap}
.pill{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--acc-soft);color:var(--acc);border:1px solid #D3E6DF}
.pill.grey{background:#F2F0EA;color:var(--mid);border-color:#E6E4DE}

.m6{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.m{background:#FBFAF7;border:1px solid var(--line);border-radius:11px;padding:10px 9px}
.m b{display:block;font-size:19px;font-weight:750;letter-spacing:-.03em;line-height:1.2;white-space:nowrap}
.m b small{font-size:10.5px;font-weight:500;color:var(--mute);margin-left:2px}
.m span{display:block;font-size:10.5px;color:var(--mute);margin-top:3px}

.bars{margin-top:16px}
.bar{display:flex;align-items:center;gap:8px;margin-top:7px}
.bar em{font-style:normal;font-size:11px;color:var(--mute);width:34px;flex:0 0 34px}
.bar .rail{flex:1;height:9px;background:#F0EEE8;border-radius:5px;overflow:hidden}
.bar .rail i{display:block;height:9px;border-radius:5px;transition:width .4s cubic-bezier(.2,.8,.3,1)}
.bar .rail.on i{background:#9BC4B7}
.bar .rail.dl i{background:var(--acc)}
.bar b{font-size:11.5px;font-weight:650;width:52px;text-align:right;flex:0 0 52px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.card h3{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.08em;margin:0 0 10px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed #EEECE6}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mute);font-size:12px}
.kv b{font-weight:650;text-align:right}

.seg{display:flex;gap:6px;flex-wrap:wrap;padding:1px 0 2px;margin-bottom:2px}
.seg button{flex:0 0 auto;background:#FBFAF7;border:1px solid var(--line);color:var(--mid);
  border-radius:20px;padding:6px 12px;font-size:12px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}

.lrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #F0EEE8}
.lrow:last-child{border-bottom:0}
.lrow .l{min-width:0}
.lrow .lt{font-size:13.5px;font-weight:650}
.lrow .ls{font-size:11.5px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .r{text-align:right;flex:0 0 auto}
.lrow .rp{font-size:14.5px;font-weight:750;letter-spacing:-.02em}
.lrow .ru{font-size:11px;color:var(--mute);margin-top:3px}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:var(--acc-soft);color:var(--acc);margin-left:5px;font-weight:600}

.say{margin-top:12px;background:#F0F4F1;border:1px solid #DDE8E2;border-radius:var(--r);padding:13px 14px;
  font-size:13px;line-height:1.7;color:#33443C}
.say b{color:var(--acc)}
.say .lbl{font-size:10.5px;color:var(--mute);letter-spacing:.08em;display:block;margin-bottom:5px}

.btnrow{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:12px;
  font-size:14px;font-weight:600}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:active{opacity:.85}

/* 训练 */
.tpile{margin-top:0}
.tcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:9px;cursor:pointer}
.tcard:active{background:#FCFCFA}
.ticon{width:38px;height:38px;border-radius:11px;background:var(--acc-soft);color:var(--acc);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ticon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tc-l{flex:1;min-width:0}
.tc-l b{font-size:14.5px;font-weight:700;display:block}
.tc-l span{font-size:11.5px;color:var(--mute);display:block;margin-top:3px}
.tc-r{font-size:11.5px;color:var(--acc);font-weight:600;flex:0 0 auto}

.streak{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:13px 6px}
.streak div{text-align:center}
.streak b{display:block;font-size:19px;font-weight:750}
.streak span{font-size:10.5px;color:var(--mute)}

/* 训练面板 */
.session{position:fixed;inset:0;max-width:560px;margin:0 auto;background:var(--bg);z-index:50;
  display:none;flex-direction:column}
.session.on{display:flex}
.shead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  background:rgba(245,244,240,.95);backdrop-filter:blur(12px)}
.shead .st{font-size:13.5px;font-weight:650;flex:1}
.shead .sn{font-size:11.5px;color:var(--mute)}
.pbar{height:3px;background:#E9E7E0}
.pbar i{display:block;height:3px;background:var(--acc);transition:width .25s}
.sbody{flex:1;overflow-y:auto;padding:18px 14px 24px}

.qtop{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);letter-spacing:.04em}
.qask{font-size:20px;font-weight:750;letter-spacing:-.02em;margin:10px 0 4px;line-height:1.35}
.qhint{font-size:12.5px;color:var(--mid)}
.opt{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;margin-top:9px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt:active{background:#FCFCFA}
.opt .ok{font-size:11px;color:var(--mute)}
.opt.right{border-color:var(--down);background:#EFF7F3}
.opt.wrong{border-color:var(--warm);background:#FBEFED}
.opt.dim{opacity:.55}

.fb{margin-top:14px;border-radius:12px;padding:13px 14px;font-size:13px;line-height:1.65;
  background:#F0F4F1;border:1px solid #DDE8E2;color:#33443C}
.fb.bad{background:#FBF1EF;border-color:#EFDAD5;color:#6B3A33}
.fb b{font-weight:700}
.fb .fl{font-size:10.5px;letter-spacing:.08em;color:var(--mute);display:block;margin-bottom:4px}

.navline{display:flex;gap:8px;margin-top:16px}
.navline .btn{padding:13px}

/* 闪卡 */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 18px;
  min-height:320px;display:flex;flex-direction:column;justify-content:center}
.fc-front{text-align:center}
.fc-eyebrow{font-size:11px;color:var(--mute);letter-spacing:.1em}
.fc-name{font-size:26px;font-weight:750;letter-spacing:-.03em;margin:10px 0 6px;line-height:1.25}
.fc-tip{font-size:12.5px;color:var(--mid);margin-top:14px}
.fc-quiz{font-size:12.5px;color:var(--muted,#8B928C);margin-top:6px}
.fc-back .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #EFEDE7;font-size:13.5px}
.fc-back .row:last-child{border-bottom:0}
.fc-back .row span{color:var(--mute);font-size:12px}
.fc-back .row b{font-weight:700}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.rate button{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:12px 4px;
  font-size:13px;font-weight:600}
.rate button.e1{border-color:#DDE8E2;color:var(--down)}
.rate button.e2{border-color:#E8E0CB;color:#9A7626}
.rate button.e3{border-color:#EFDAD5;color:var(--warm)}

/* 猜价 */
.guessnum{text-align:center;margin:18px 0 6px;font-size:40px;font-weight:750;letter-spacing:-.04em}
.guessnum small{font-size:14px;color:var(--mute);font-weight:500;margin-left:4px}
input[type=range]{width:100%;accent-color:var(--acc);margin:14px 0}
.scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute)}

/* 空状态 */
.empty{padding:44px 20px;text-align:center;color:var(--mute);font-size:13px}

/* 我的 */
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.lv{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 6px;text-align:center}
.lv b{display:block;font-size:19px;font-weight:750}
.lv span{font-size:10px;color:var(--mute)}
.lvbar{height:7px;background:#EFEDE7;border-radius:4px;overflow:hidden;display:flex}
.lvbar i{height:7px;display:block}
.note{font-size:11.5px;color:var(--mute);line-height:1.7}
.favrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F0EEE8;font-size:13.5px}
.favrow:last-child{border-bottom:0}
.favrow span{font-size:11.5px;color:var(--mute)}

/* 底栏 */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;
  background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:30}
.nav button{background:none;border:0;padding:8px 0 7px;color:var(--mute);font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:var(--acc)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#wm{position:fixed;inset:0;z-index:9999;pointer-events:none;background-repeat:repeat;
  background-size:320px 200px;-webkit-animation:wmd 26s linear infinite;animation:wmd 26s linear infinite}
@-webkit-keyframes wmd{from{background-position:0 0}to{background-position:320px 200px}}
@keyframes wmd{from{background-position:0 0}to{background-position:320px 200px}}
</style>
</head>
<body>
<div id="wm" aria-hidden="true"></div>
<div class="app">
  <header class="topbar">
    <div>
      <div class="tb-title" id="tbTitle">商圈行情</div>
      <div class="tb-sub" id="tbSub">黄岛 · 11 商圈 · 175 小区</div>
    </div>
    <div class="tb-tag" id="tbTag">数据 2026-10-22</div>
  </header>

  <main>
    <section class="view on" id="v-biz"></section>
    <section class="view" id="v-cs"></section>
    <section class="view" id="v-train"></section>
    <section class="view" id="v-me"></section>
  </main>

  <nav class="nav">
    <button data-tab="biz" class="on">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
      <span>商圈</span>
    </button>
    <button data-tab="cs">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h3M8 12h2M8 16h2M15 7v3M13.5 11h3v6h-3z"/></svg>
      <span>小区</span>
    </button>
    <button data-tab="train">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.4 3.4L18 7.6l-1 3.7 1 3.7-3.6 1.2L12 19.8 9.6 16.4 6 15.2l1-3.7-1-3.7 3.6-1.2z"/><path d="M12 9.5v5"/></svg>
      <span>训练</span>
    </button>
    <button data-tab="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c.6-3.6 3.7-5.8 7.5-5.8s6.9 2.2 7.5 5.8"/></svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<div class="detail" id="detail"></div>

/* ---------- 工具 ---------- */

const band = p => { if(p==null) return '—'; const lo=Math.floor(p/1000); return (lo/10).toFixed(1)+'–'+((lo+1)/10).toFixed(1)+'万'; };
const fc = n => n==null ? '—' : Number(n).toLocaleString('zh-CN');
const PMIN = 5500, PMAX = 34500;
const posPct = v => Math.max(0,Math.min(100,(v-PMIN)/(PMAX-PMIN)*100));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- 本地存储 ---------- */
const KEY='hd_memo_v1';
let store={prog:{},fav:[],done:0};
try{const raw=localStorage.getItem(KEY); if(raw) store=Object.assign(store,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}};
const prog = id => store.prog[id] || {l:0,due:0,r:0,w:0};
const IV=[0,0.5,3,10];
function mark(id, ok, fuzzy){
  const p=Object.assign({l:0,due:0,r:0,w:0},prog(id));
  if(fuzzy){ p.due=Date.now()+0.5*864e5; }
  else if(ok){ p.l=Math.min(3,p.l+1); p.r++; p.due=Date.now()+IV[p.l]*864e5; store.done=(store.done||0)+1; }
  else { p.l=Math.max(0,p.l-1); p.w++; p.due=Date.now()+0.15*864e5; }
  store.prog[id]=p; save();
}
const dueNow = () => CS.filter(c=>prog(c.id).due<=Date.now()).length;
const mastered = () => CS.filter(c=>prog(c.id).l>=2).length;
const favOn = id => (store.fav||[]).includes(id);
function toggleFav(id){
  store.fav = store.fav||[];
  const i=store.fav.indexOf(id);
  if(i>=0) store.fav.splice(i,1); else store.fav.unshift(id);
  save();
}

/* ---------- 商圈 ---------- */
function renderBiz(){
  const list=[...BIZ];
  if(state.bizSort==='on') list.sort((a,b)=>b.on-a.on);
  if(state.bizSort==='deal') list.sort((a,b)=>b.deal-a.deal);
  if(state.bizSort==='aoprice') list.sort((a,b)=>(b.ao||0)-(a.ao||0));
  if(state.bizSort==='price') list.sort((a,b)=>(b.ad||0)-(a.ad||0));
  const rows=list.map(b=>{
    const onL=posPct(b.aomin||0), onW=Math.max(1.5,posPct(b.aomax||0)-onL);
    const dlL=posPct(b.admin||0), dlW=Math.max(1.5,posPct(b.admax||0)-dlL);
    return `<div class="bcard" data-biz="${esc(b.n)}">
      <div class="bt"><div class="bname">${esc(b.n)}</div><div class="bcnt">${b.cc} 个小区</div></div>
      <div class="bvol">在售 <b>${fc(b.on)}</b> 套 · 成交 <b>${fc(b.deal)}</b> 套 · 2026年成交 <b>${fc(b.d26)}</b> 套</div>
      <div class="tracks">
        <div class="track on"><em>在售</em><div class="rail"><i style="left:${onL}%;width:${onW}%"></i></div></div>

  $('#v-biz').innerHTML=`

      <div><b>${CS.length}</b><span>小区</span></div>

/* ---------- 训练：出题 ---------- */
function pickQueue(n, mode){
  const now=Date.now();
  let pool=CS.filter(c=>{
    if(mode==='guess') return !!c.ad;
    if(mode==='rep') return !!(c.onTop||c.dealTop);
    return true;
  });
  const due=pool.filter(c=>prog(c.id).due<=now).sort((a,b)=>prog(a.id).l-prog(b.id).l);
  const rest=shuffle(pool.filter(c=>prog(c.id).due>now));
  // 低熟练度优先，其余随机补足
  const lowFirst = due.slice().sort((a,b)=>prog(a.id).l-prog(b.id).l).slice(0,n);
  const merged = [...lowFirst, ...shuffle(due.filter(c=>!lowFirst.includes(c))), ...rest];
  const seen=new Set(); const uniq=[];
  for(const c of merged){ if(!seen.has(c.id)){seen.add(c.id);uniq.push(c);} }
  return uniq.slice(0,n);
}
function pickWeakQueue(n){
  const weak=CS.filter(c=>prog(c.id).l<2).sort((a,b)=>{
    const pa=prog(a.id), pb=prog(b.id);
    return (pb.w-pa.w)||(pa.l-pb.l);
  });
  return shuffle(weak.slice(0,Math.max(n,6))).slice(0,n);
}
const REP_KINDS=[
  {k:'view',label:'带看最多',list:'onTop',field:'view',q:'哪一套带看次数最多？',qty:v=>`带看 ${v} 次`},
  {k:'score',label:'评分最高',list:'onTop',field:'score',q:'哪一套评分最高？',qty:v=>`评分 ${v}`},
  {k:'low',label:'在售单价最低',list:'onTop',field:'low',q:'哪一套在售单价最低？',qty:null},
  {k:'dlow',label:'成交单价最低',list:'dealTop',field:'low',q:'哪一套成交单价最低？',qty:null},
  {k:'fast',label:'成交最快',list:'dealTop',field:'fast',q:'哪一套成交周期最短？',qty:v=>`${v} 天`},
  {k:'nego',label:'议价空间最大',list:'dealTop',field:'nego',q:'哪一套议价空间最大？',qty:v=>`${v}%`}
];
const REP_IDX={view:6,score:7,low:3,dlow:3,fast:6,nego:7};

function makeQuestion(mode,c){
  if(mode==='biz'){
    const others=shuffle(BIZ.map(b=>b.n).filter(n=>n!==c.b)).slice(0,3);
    return {type:'biz',c,opts:shuffle([c.b,...others])};
  }
  if(mode==='guess') return {type:'guess',c,guess:c.ad};
  if(mode==='rep'){
    const kinds=shuffle(REP_KINDS.filter(k=>c[k.list]&&c[k.list][k.field]&&c[k.list][k.field].length>=3));
    if(!kinds.length) return null;
    const kind=kinds[0];
    const list=c[kind.list][kind.field];
    const ci=Math.floor(Math.random()*Math.min(3,list.length));
    const correct=list[ci];
    const others=shuffle(list.filter((_,i)=>i!==ci)).slice(0,2);
    const opts=shuffle([{row:correct,ok:true},...others.map(r=>({row:r,ok:false}))]);
    return {type:'rep',c,kind,opts};
  }
  return null;
}

/* ---------- 训练面板 ---------- */
function startSession(mode,keepLayer){
  let queue, total;
  if(mode==='flash'){ queue=pickQueue(12); total=queue.length; }
  else if(mode==='weak'){ queue=pickWeakQueue(10); total=queue.length; }
  else if(mode==='guess'){ queue=pickQueue(8,'guess'); total=queue.length; }
  else if(mode==='rep'){ queue=pickQueue(14,'rep'); total=queue.length; }
  else { queue=pickQueue(10); total=queue.length; }
  state.q={mode,queue,total,i:0,right:0,wrong:[],answered:false,item:null};
  if(!$('#session').classList.contains('on') && !keepLayer) pushNav({v:{type:'session'}});
  $('#session').classList.add('on');
  nextQuestion();
}
function endSession(){ $('#session').classList.remove('on'); state.q=null; }
function nextQuestion(){
  const q=state.q; if(!q) return;
  q.answered=false;
  if(q.i>=q.total){ return renderSummary(); }
  if(q.mode==='biz'||q.mode==='weak'){
    q.item={type:'biz',c:q.queue[q.i],opts:null};
    const c=q.queue[q.i];
    q.item.opts=shuffle([c.b,...shuffle(BIZ.map(b=>b.n).filter(n=>n!==c.b)).slice(0,3)]);
  } else if(q.mode==='guess'){
    q.item={type:'guess',c:q.queue[q.i],guess:q.queue[q.i].ad};
  } else if(q.mode==='rep'){
    let item=null, tries=0;
    while(!item && tries<20){ item=makeQuestion('rep',q.queue[(q.i+tries)%q.total]); tries++; }
    if(!item){ q.i++; return nextQuestion(); }
    q.item=item;
  } else {
    q.item={type:'flash',c:q.queue[q.i]};
  }
  renderQuestion();
}
function sessionHead(title){
  const q=state.q;
  const pct=Math.round(q.i/Math.max(q.total,1)*100);
  return `<div class="shead">
      <button class="iconbtn" id="sClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="st">${title}</div><div class="sn num">${Math.min(q.i+1,q.total)} / ${q.total}</div>
    </div><div class="pbar"><i style="width:${pct}%"></i></div>`;
}
function renderQuestion(){
  const q=state.q, it=q.item, c=it.c, isWeak=q.mode==='weak';
  const titles={flash:'闪卡自测',biz:'商圈归属',guess:'猜成交价',rep:'代表房源',weak:'薄弱复习'};
  let body='';
  if(it.type==='flash'){
    body=`<div class="qtop"><span>看名想价</span><span>先回忆，再翻面</span></div>
      <div class="fcard" id="fcard">
        <div class="fc-front" id="fcFront">
          <div class="fc-eyebrow">小区</div>
          <div class="fc-name">${esc(c.n)}</div>
          <div class="fc-tip">它属于哪个商圈？在售均价、成交均价大概多少？</div>
          <div class="fc-quiz">想好了就点下面翻面</div>
        </div>
        <div class="fc-back" id="fcBack" style="display:none">
          <div class="fc-eyebrow" style="text-align:center">${esc(c.n)}</div>
          <div style="margin-top:10px">
            <div class="row"><span>商圈</span><b>${esc(c.b)}</b></div>
            <div class="row"><span>在售 / 累计成交</span><b>${c.on} 套 / ${c.deal} 套</b></div>
            <div class="row"><span>2026 年成交</span><b>${c.d26||0} 套</b></div>
            <div class="row"><span>在售均价</span><b>${c.ao?fc(c.ao)+' 元/㎡':'—'}</b></div>
            <div class="row"><span>成交均价</span><b>${c.ad?fc(c.ad)+' 元/㎡':'暂无 2026 成交'}</b></div>
            <div class="row"><span>价格带</span><b>${c.ao?band(c.ao):'—'}</b></div>
            ${c.dealSt?`<div class="row"><span>成交周期 / 议价</span><b>${c.dealSt.cycle} 天 / ${c.dealSt.nego}%</b></div>`:''}
          </div>
        </div>
      </div>
      <div class="btnrow" id="flipRow"><button class="btn primary" id="flipBtn">翻面看答案</button></div>
      <div class="rate" id="rateRow" style="display:none">
        <button class="e3" data-rate="no">忘了</button>
        <button class="e2" data-rate="fuzzy">有点模糊</button>
        <button class="e1" data-rate="yes">记住了</button>
      </div>`;
  } else if(it.type==='biz'){
    body=`<div class="qtop"><span>商圈归属</span><span>${isWeak?'薄弱复习':'第 '+(q.i+1)+' 题'}</span></div>
      <div class="qask">${esc(c.n)}</div>
      <div class="qhint">在售 ${c.on} 套 · 成交 ${c.deal} 套，它属于哪个商圈？</div>
      ${it.opts.map(o=>`<button class="opt" data-opt="${esc(o)}"><span>${esc(o)}</span><span class="ok"></span></button>`).join('')}
      <div id="fb"></div>`;
  } else if(it.type==='guess'){
    body=`<div class="qtop"><span>猜成交均价</span><span>误差 ±10% 算对</span></div>
      <div class="qask">${esc(c.n)}</div>
      <div class="qhint">${esc(c.b)} · 2026 年成交 ${c.d26||0} 套 · 累计 ${c.deal} 套</div>
      <div class="guessnum"><span id="gv">15000</span><small>元/㎡</small></div>
      <input type="range" id="gr" min="5000" max="35000" step="100" value="15000">
      <div class="scale"><span>5千</span><span>1.5万</span><span>2.5万</span><span>3.5万</span></div>
      <div class="btnrow"><button class="btn primary" id="gsubmit">确认估值</button></div>
      <div id="fb"></div>`;
  } else {
    const kind=it.kind;
    body=`<div class="qtop"><span>代表房源 · ${kind.label}</span><span>${esc(c.n)}</span></div>
      <div class="qask">${kind.q}</div>
      <div class="qhint">${esc(c.b)} · 下方为该小区候选房源</div>
      ${it.opts.map((o,i)=>{
        const r=o.row, k=it.kind.k;
        const onSide = k==='view'||k==='score'||k==='low';
        const price=r[2], unit=r[3];
        let sub=r[4];
        if(onSide) sub+=` · 带看${r[6]}次 · 评分${r[7]}`;
        else sub+=` · 成交${r[5]} · ${r[6]}天 · 议价${r[7]}%`;
        return `<button class="opt" data-rep="${i}">
          <span style="text-align:left"><b style="font-size:14px">${esc(r[0])} · ${r[1]}㎡</b>
            <span style="display:block;font-size:11.5px;color:#8B928C;margin-top:3px">${sub}</span></span>
          <span style="text-align:right;flex:0 0 auto"><b style="display:block">${wan(price,1)}万</b>
            <span style="font-size:10.5px;color:#8B928C">${fc(unit)} 元/㎡</span></span>
        </button>`;
      }).join('')}
      <div id="fb"></div>`;
  }
  $('#session').innerHTML=`${sessionHead(titles[q.mode])}<div class="sbody">${body}</div>`;
  bindQuestion();
}
function factLine(c){
  return `<b>${esc(c.n)}</b> 属于 <b>${esc(c.b)}</b>，在售 ${c.on} 套、累计成交 ${c.deal} 套；在售均价 ${c.ao?fc(c.ao)+' 元/㎡（'+band(c.ao)+'）':'—'}，2026 年以来成交 ${c.d26||0} 套，成交均价 ${c.ad?fc(c.ad)+' 元/㎡':'暂无'}。`;
}
function answer(ok, fbHtml){
  const q=state.q, c=q.item.c;
  q.answered=true;
  if(ok){ q.right++; mark(c.id,true); } else { q.wrong.push(c.id); mark(c.id,false); }
  const fb=$('#fb');
  if(fb) fb.innerHTML=`<div class="fb ${ok?'':'bad'}"><span class="fl">${ok?'答对了':'答错了'}</span>${fbHtml}</div>
    <div class="navline"><button class="btn primary" id="nextBtn">${q.i+1>=q.total?'查看结果':'下一题'}</button></div>`;
  const nb=$('#nextBtn'); if(nb) nb.onclick=()=>{q.i++;nextQuestion();};
}
function bindQuestion(){
  const q=state.q;
  $('#sClose').onclick=()=>{ if(confirm('退出本次训练？')) popTop(); };
  const it=q.item;
  if(it.type==='flash'){
    $('#flipBtn').onclick=()=>{
      $('#fcFront').style.display='none';
      $('#fcBack').style.display='block';
      $('#flipRow').style.display='none';
      $('#rateRow').style.display='grid';
    };
    document.querySelectorAll('#rateRow button').forEach(b=>{
      b.onclick=()=>{
        const r=b.dataset.rate;
        if(r==='no') mark(it.c.id,false);
        else if(r==='fuzzy') mark(it.c.id,false,true);
        else mark(it.c.id,true);
        q.i++; nextQuestion();
      };
    });
    return;
  }
  if(it.type==='biz'){
    document.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        if(q.answered) return;
        const val=b.dataset.opt, ok=val===it.c.b;
        document.querySelectorAll('.opt').forEach(x=>{
          const isC=x.dataset.opt===it.c.b;
          if(isC) x.classList.add('right');
          else if(x===b) x.classList.add('wrong');
          else x.classList.add('dim');
          if(isC) x.querySelector('.ok').textContent='正确';
          if(x===b&&!ok) x.querySelector('.ok').textContent='你选的';
        });
        answer(ok, factLine(it.c)+`<br>正确答案：<b>${esc(it.c.b)}</b>`);
      };
    });
    return;
  }
  if(it.type==='guess'){
    const gr=$('#gr'), gv=$('#gv');
    gr.oninput=()=>{gv.textContent=Number(gr.value).toLocaleString('zh-CN');};
    $('#gsubmit').onclick=()=>{
      if(q.answered) return;
      const g=Number(gr.value), real=it.c.ad, diff=Math.abs(g-real)/real;
      const ok=diff<=0.10;
      gr.disabled=true; $('#gsubmit').style.display='none';
      answer(ok, `你的估值 <b>${fc(g)} 元/㎡</b>，实际 2026 年成交均价 <b>${fc(real)} 元/㎡</b>（偏差 ${(diff*100).toFixed(1)}%）。<br>${factLine(it.c)}`);
    };
    return;
  }
  if(it.type==='rep'){
    document.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        if(q.answered) return;
        const i=Number(b.dataset.rep), ok=it.opts[i].ok;
        document.querySelectorAll('.opt').forEach((x,j)=>{
          if(it.opts[j].ok) x.classList.add('right');
          else if(x===b) x.classList.add('wrong');
          else x.classList.add('dim');
        });
        const correct=it.opts.find(o=>o.ok).row;
        const idx=REP_IDX[it.kind.k];
        answer(ok, `「${it.kind.label}」是 <b>${esc(correct[0])} · ${correct[1]}㎡ · ${wan(correct[2],1)}万</b>（${fc(correct[3])} 元/㎡）${it.kind.qty?'，'+it.kind.qty(correct[idx]):''}。<br>${factLine(q.item.c)}`);
      };
    });
    return;
  }
}
function renderSummary(){
  const q=state.q;
  const pct=q.total?Math.round(q.right/q.total*100):0;
  const wrongq=(q.wrong||[]).map(id=>BY_ID.get(id)).filter(Boolean).slice(0,6);
  $('#session').innerHTML=`${sessionHead('本组完成')}
    <div class="sbody">
      <div style="text-align:center;margin:22px 0 6px">
        <div style="font-size:46px;font-weight:750;letter-spacing:-.04em" class="num">${pct}<small style="font-size:16px">%</small></div>
        <div style="font-size:12.5px;color:#8B928C;margin-top:4px">答对 ${q.right} / ${q.total} 题</div>
      </div>
      ${wrongq.length?`<div class="card"><h3>需要再记一遍</h3>${wrongq.map(c=>`<div class="lrow" data-cid="${c.id}">
          <div class="l"><div class="lt">${esc(c.n)}</div><div class="ls">${esc(c.b)} · 在售 ${c.ao?fc(c.ao):'—'} / 成交 ${c.ad?fc(c.ad):'—'}</div></div>
          <div class="r"><div class="ru">点开查看</div></div></div>`).join('')}</div>`:''}
      <div class="btnrow">
        <button class="btn" id="againBtn">再来一组</button>
        <button class="btn primary" id="doneBtn">返回</button>
      </div>
    </div>`;
  $('#sClose').onclick=()=>popTop();
  $('#againBtn').onclick=()=>{ const m=q.mode; endSession(); startSession(m==='weak'?'biz':m,true); };
  $('#doneBtn').onclick=()=>{ endSession(); go('train'); popTop(); };
  document.querySelectorAll('[data-cid]').forEach(el=>{
    el.onclick=()=>{ const id=Number(el.dataset.cid); endSession(); openDetail(id); };
  });
}

/* ---------- 事件 ---------- */
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));

document.addEventListener('click',e=>{
  const t=e.target;
  const bs=t.closest('[data-bsort]');
  if(bs){ state.bizSort=bs.dataset.bsort; renderBiz(); return; }
  const bz=t.closest('[data-biz]');
  if(bz){ openBiz(bz.dataset.biz); return; }
  const cs=t.closest('[data-csort]');
  if(cs){ state.csSort=cs.dataset.csort; renderCs(); return; }
  const cb=t.closest('[data-csbiz]');
  if(cb){ state.csBiz=cb.dataset.csbiz; renderCs(); return; }
  const cid=t.closest('[data-cid]');
  if(cid){ openDetail(Number(cid.dataset.cid)); return; }
  const dt=t.closest('[data-dtab]');
  if(dt){ const top=$('#detail').scrollTop; state.detailTab=dt.dataset.dtab; renderDetail(state.detailId); $('#detail').scrollTop=top; return; }
  const cl=t.closest('[data-close]');
  if(cl){ popTop(); return; }
  const fv=t.closest('[data-fav]');
  if(fv){ const id=Number(fv.dataset.fav); toggleFav(id);
    fv.classList.toggle('act',favOn(id));
    const b2=document.querySelector('[data-fav2]'); if(b2) b2.textContent=favOn(id)?'取消收藏':'收藏';
    return; }
  const fv2=t.closest('[data-fav2]');
  if(fv2){ const id=Number(fv2.dataset.fav2); toggleFav(id);
    if(state.detailId===id) renderDetail(id);
    return; }
  const memo=t.closest('[data-memo]');
  if(memo){ const id=Number(memo.dataset.memo); closeDetail(); state.q={mode:'flash',queue:[BY_ID.get(id)],total:1,i:0,right:0,wrong:[],answered:false,item:{type:'flash',c:BY_ID.get(id)}};
    $('#session').classList.add('on'); renderQuestion(); return; }
  const mode=t.closest('[data-mode]');
  if(mode){ startSession(mode.dataset.mode); return; }
  const rs=t.closest('#resetAll');
  if(rs){ if(confirm('清空所有训练记录与收藏？')){ store={prog:{},fav:[],done:0}; save(); renderMe(); } return; }
});

/* 初始化 */
(function init(){
  const wm=document.getElementById('wm');
  const WM='薄金升18953236586';
  if(wm){
    const svg="<svg xmlns='http://www.w3.org/2000/svg' width='320' height='200'>"+
      "<text x='160' y='108' font-family='PingFang SC,Microsoft YaHei,sans-serif' font-size='15'"+
      " fill='black' fill-opacity='0.06' text-anchor='middle' transform='rotate(-18 160 108)'>"+WM+"</text></svg>";
    wm.style.backgroundImage='url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'")';
    wm.dataset.wm=WM;
  }
  renderBiz();
  $('#tbTag').textContent='数据 '+META.date;
})();
</script>
